<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z4 MotionCam</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 10px 16px; background: #1d1d1d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  #state { font-size: 14px; color: #bbb; }
  #state.rec { color: #ff5a5a; font-weight: bold; }
  main { max-width: 960px; margin: 0 auto; padding: 12px 16px 40px; }
  .view { position: relative; background: #000; border-radius: 8px; overflow: hidden;
          aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
  .view img { max-width: 100%; max-height: 100%; }
  .view .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               flex-direction: column; gap: 10px; background: rgba(0,0,0,.6); text-align: center; padding: 16px; }
  button { font-size: 15px; padding: 8px 16px; border-radius: 6px; border: 0; background: #3a6df0; color: #fff; }
  button.secondary { background: #333; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  button.danger, .btn.danger { background: #b3261e; }
  button:disabled { opacity: .4; }
  .btn { display: inline-block; font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 0;
         background: #333; color: #fff; text-decoration: none; line-height: 1.2; cursor: pointer; }
  .toolbar { position: sticky; top: 0; z-index: 1; background: #111; display: flex; flex-wrap: wrap;
             align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid #2a2a2a; }
  .toolbar .all { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-right: auto; }
  #selInfo { width: 100%; }
  #selInfo:empty { display: none; }
  #notice { min-height: 1.4em; margin: 6px 4px; }
  input[type=checkbox] { width: 22px; height: 22px; margin: 0; accent-color: #3a6df0; flex: none; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #2a2a2a; }
  li.checked { background: #1a2238; }
  li .chk { display: flex; padding: 6px; margin: -6px; }
  li .info { flex: 1; min-width: 0; }
  li .info a { color: #8ab4ff; word-break: break-all; }
  li.playing .info a { font-weight: bold; }
  li .actions { display: flex; gap: 6px; flex: none; }
  .meta { color: #999; font-size: 13px; }
  video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; margin-top: 8px; display: none; }
  .hidden { display: none !important; }
  .panel { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-top: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: #999; }
  .kv dd { margin: 0; word-break: break-all; }
  .verdict { margin: 12px 0 6px; font-weight: bold; }
  .verdict.ok { color: #7bd88f; }
  .verdict.ng { color: #ffb74d; }
  ol.advice { padding-left: 20px; margin: 6px 0; font-size: 14px; }
  ol.advice li { display: list-item; border: 0; padding: 3px 0; }
  .fp { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Z4 MotionCam</h1>
  <span id="state">接続中…</span>
</header>
<main>
  <div class="view">
    <img id="live" alt="ライブ映像">
    <div id="paused" class="msg hidden">
      <div>発熱を抑えるため、ライブ映像は10分で自動停止します</div>
      <button id="resume">ライブ再開</button>
    </div>
  </div>
  <p><button class="secondary" id="toggle">ライブ停止</button></p>

  <h2>録画</h2>
  <video id="player" controls playsinline></video>
  <div class="toolbar">
    <label class="all"><input type="checkbox" id="selAll">すべて選択</label>
    <button id="bulkSave" disabled>一括保存</button>
    <button id="bulkDel" class="danger" disabled>一括削除</button>
    <div id="selInfo" class="meta"></div>
  </div>
  <div id="notice" class="meta" role="status"></div>
  <ul id="list"><li class="meta">読み込み中…</li></ul>
  <h2>外出先からの視聴</h2>
  <div class="panel">
    <dl class="kv" id="remoteKv"></dl>
    <p class="meta" id="remoteHint"></p>
    <button class="secondary" id="diagBtn">ネットワーク診断を実行</button>
    <div id="diag" class="hidden">
      <div class="verdict" id="diagVerdict"></div>
      <dl class="kv" id="diagKv"></dl>
      <ol class="advice" id="diagAdvice"></ol>
    </div>
  </div>

  <!-- Bulk save posts the names so the browser streams the ZIP straight to a download. -->
  <form id="zipForm" method="post" action="/api/zip" class="hidden">
    <input type="hidden" name="names">
  </form>
</main>
<script>
(function () {
  var LIVE_LIMIT_MS = 10 * 60 * 1000;
  var live = document.getElementById('live');
  var paused = document.getElementById('paused');
  var toggle = document.getElementById('toggle');
  var stateEl = document.getElementById('state');
  var player = document.getElementById('player');
  var liveTimer = null;
  var rotation = 0;

  function startLive() {
    live.src = '/stream.mjpg?t=' + Date.now();
    paused.classList.add('hidden');
    toggle.textContent = 'ライブ停止';
    clearTimeout(liveTimer);
    liveTimer = setTimeout(stopLive, LIVE_LIMIT_MS);
  }
  function stopLive() {
    live.removeAttribute('src');
    live.src = '';
    paused.classList.remove('hidden');
    toggle.textContent = 'ライブ再開';
    clearTimeout(liveTimer);
  }
  toggle.onclick = function () { live.getAttribute('src') ? stopLive() : startLive(); };
  document.getElementById('resume').onclick = startLive;
  // Stop streaming when the tab is hidden: the phone only encodes JPEGs while someone watches.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLive(); else startLive();
  });

  function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB'; }
  function fmtName(n) {
    var m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(n);
    return m ? m[1] + '/' + m[2] + '/' + m[3] + ' ' + m[4] + ':' + m[5] + ':' + m[6] : n;
  }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  // ---- recordings: list, selection, save / delete ----
  var MAX_ZIP_BYTES = 3.9e9; // the phone cannot write ZIP files over 4 GB (no ZIP64 before Android 7)
  var listEl = document.getElementById('list');
  var selAll = document.getElementById('selAll');
  var bulkSave = document.getElementById('bulkSave');
  var bulkDel = document.getElementById('bulkDel');
  var selInfo = document.getElementById('selInfo');
  var notice = document.getElementById('notice');
  var zipForm = document.getElementById('zipForm');
  var items = [];
  var selected = {};
  var playing = null;
  var busy = false;

  function say(text) { notice.textContent = text || ''; }
  function recUrl(name) { return '/rec/' + encodeURIComponent(name); }

  function selectedItems() {
    return items.filter(function (it) { return selected[it.name]; });
  }

  function updateToolbar() {
    var sel = selectedItems();
    var size = sel.reduce(function (a, it) { return a + it.size; }, 0);
    bulkSave.disabled = bulkDel.disabled = busy || sel.length === 0;
    selAll.disabled = busy || items.length === 0;
    selAll.checked = items.length > 0 && sel.length === items.length;
    selAll.indeterminate = sel.length > 0 && sel.length < items.length;
    selInfo.textContent = sel.length ? sel.length + '件選択中（' + fmtSize(size) + '）' : '';
  }

  function render() {
    listEl.textContent = '';
    if (!items.length) listEl.appendChild(el('li', 'まだ録画はありません', 'meta'));
    items.forEach(function (it) {
      var li = el('li');
      if (selected[it.name]) li.classList.add('checked');
      if (playing === it.name) li.classList.add('playing');

      var chkWrap = el('label', null, 'chk');
      var chk = el('input');
      chk.type = 'checkbox';
      chk.checked = !!selected[it.name];
      chk.setAttribute('aria-label', fmtName(it.name) + ' を選択');
      chk.onchange = function () {
        if (chk.checked) selected[it.name] = true; else delete selected[it.name];
        li.classList.toggle('checked', chk.checked);
        updateToolbar();
      };
      chkWrap.appendChild(chk);

      var info = el('div', null, 'info');
      var play = el('a', fmtName(it.name));
      play.href = '#';
      play.onclick = function (ev) {
        ev.preventDefault();
        playing = it.name;
        player.style.display = 'block';
        player.src = recUrl(it.name);
        player.play();
        player.scrollIntoView({ behavior: 'smooth' });
        render();
      };
      info.appendChild(play);
      info.appendChild(el('div', fmtSize(it.size), 'meta'));

      var actions = el('div', null, 'actions');
      var save = el('a', '保存', 'btn');
      save.href = recUrl(it.name) + '?dl=download';
      save.setAttribute('download', it.name);
      var del = el('button', '削除', 'btn danger');
      del.disabled = busy;
      del.onclick = function () { deleteFiles([it.name]); };
      actions.appendChild(save);
      actions.appendChild(del);

      li.appendChild(chkWrap);
      li.appendChild(info);
      li.appendChild(actions);
      listEl.appendChild(li);
    });
    updateToolbar();
  }

  function loadList() {
    return fetch('/api/recordings').then(function (r) { return r.json(); }).then(function (data) {
      items = data;
      // Forget selections of files that no longer exist (e.g. removed by the storage rotation).
      var present = {};
      items.forEach(function (it) { present[it.name] = true; });
      Object.keys(selected).forEach(function (n) { if (!present[n]) delete selected[n]; });
      render();
    }).catch(function () {});
  }

  function saveFiles(names) {
    if (names.length === 1) {
      var a = el('a');
      a.href = recUrl(names[0]) + '?dl=download';
      a.setAttribute('download', names[0]);
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }
    var total = selectedItems().reduce(function (s, it) { return s + it.size; }, 0);
    if (total > MAX_ZIP_BYTES) {
      say('選択したファイルの合計が大きすぎます（一括保存は3.9GBまで）。選択を減らしてください。');
      return;
    }
    zipForm.elements.names.value = names.join('\n');
    zipForm.submit();
    say(names.length + '件をZIPにまとめて保存します（無圧縮）…');
  }

  function deleteFiles(names) {
    var msg = names.length === 1
      ? '「' + fmtName(names[0]) + '」を削除しますか？\n削除すると元に戻せません。'
      : names.length + '件の録画を削除しますか？\n削除すると元に戻せません。';
    if (!confirm(msg)) return;
    busy = true;
    render();
    fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8', 'X-Requested-With': 'z4motioncam' },
      body: names.join('\n')
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (res) {
      res.deleted.forEach(function (n) {
        delete selected[n];
        if (playing === n) {
          playing = null;
          player.pause();
          player.removeAttribute('src');
          player.load();
          player.style.display = 'none';
        }
      });
      say(res.deleted.length + '件削除しました' + (res.failed.length ? '（' + res.failed.length + '件は削除できませんでした）' : ''));
    }).catch(function (e) {
      say('削除に失敗しました: ' + e.message);
    }).then(function () {
      busy = false;
      return loadList();
    });
  }

  selAll.onchange = function () {
    selected = {};
    if (selAll.checked) items.forEach(function (it) { selected[it.name] = true; });
    render();
  };
  bulkSave.onclick = function () {
    saveFiles(selectedItems().map(function (it) { return it.name; }));
  };
  bulkDel.onclick = function () {
    deleteFiles(selectedItems().map(function (it) { return it.name; }));
  };

  // ---- remote access & network diagnosis ----
  var remoteKv = document.getElementById('remoteKv');
  var remoteHint = document.getElementById('remoteHint');
  var diagBtn = document.getElementById('diagBtn');

  function fillKv(dl, rows) {
    dl.textContent = '';
    rows.forEach(function (r) {
      if (r[1] === null || r[1] === undefined || r[1] === '') return;
      dl.appendChild(el('dt', r[0]));
      var dd = el('dd', null, r[2] || '');
      if (/^https:\/\//.test(r[1])) {
        var a = el('a', r[1]);
        a.href = r[1];
        a.style.color = '#8ab4ff';
        dd.appendChild(a);
      } else {
        dd.textContent = r[1];
      }
      dl.appendChild(dd);
    });
  }

  function showRemote(r) {
    if (!r || !r.enabled) {
      fillKv(remoteKv, [['状態', '無効']]);
      remoteHint.textContent = 'ネットワーク診断で「外出先から視聴できます」と判定されたら、Z4の「設定 > 外出先からの視聴」を有効にしてください。';
      return;
    }
    fillKv(remoteKv, [
      ['状態', r.state + (r.error ? '（' + r.error + '）' : '')],
      ['外出先URL', r.url],
      ['ポート開放', r.upnp],
      ['DDNS', r.ddns],
      ['公開IPv4', r.publicV4],
      ['IPv6', r.globalV6],
      ['自己接続テスト', r.selfReachable === true ? '外部ポートへ接続できました' : null],
      ['証明書の指紋', r.fingerprint, 'fp']
    ]);
    remoteHint.textContent = r.active
      ? '外出先では上のURLをモバイル回線で開きます。初回は「保護されていない通信」と警告が出るので、証明書の指紋（SHA-256）が上と一致することを確かめてから進んでください。'
      : '';
  }

  var VERDICT_OK = { GLOBAL_ON_ROUTER: true };
  diagBtn.onclick = function () {
    diagBtn.disabled = true;
    diagBtn.textContent = '診断中…（10秒ほどかかります）';
    fetch('/api/netdiag?refresh=1').then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('diag').classList.remove('hidden');
      var v = document.getElementById('diagVerdict');
      var v6 = d.globalV6 ? ' IPv6なら接続できる可能性があります。' : '';
      v.textContent = (VERDICT_OK[d.verdict] ? '◎ ' : '△ ') + d.summary + (VERDICT_OK[d.verdict] ? '' : v6);
      v.className = 'verdict ' + (VERDICT_OK[d.verdict] ? 'ok' : 'ng');
      fillKv(document.getElementById('diagKv'), [
        ['Z4のLAN IP', d.localV4],
        ['ルーター', d.gateway],
        ['公開IPv4（外から見たIP）', d.publicV4 || '取得できません'],
        ['ルーターのWAN側IPv4', d.upnp ? (d.routerWanV4 || '（なし）') : null],
        ['UPnP', d.upnp ? '応答あり' : (d.upnpError || '応答なし')],
        ['IPv6グローバル', d.globalV6 || 'なし'],
        ['診断時刻', new Date(d.checkedAt).toLocaleString()]
      ]);
      var ol = document.getElementById('diagAdvice');
      ol.textContent = '';
      d.advice.forEach(function (t) { ol.appendChild(el('li', t)); });
    }).catch(function () {
      document.getElementById('diag').classList.remove('hidden');
      document.getElementById('diagVerdict').textContent = 'ネットワーク診断に失敗しました';
    }).then(function () {
      diagBtn.disabled = false;
      diagBtn.textContent = 'ネットワーク診断を実行';
    });
  };

  var STATE = { recording: '● 録画中', watching: '監視中', starting: 'カメラ準備中',
                cooling: '高温のため一時停止中', stopped: '停止中' };
  var lastState = '';
  function loadStatus() {
    fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
      var txt = (STATE[s.state] || s.state) + '  電池 ' + s.tempC.toFixed(1) + '℃'
        + (s.charging ? '（充電中）' : '') + '  空き ' + (s.freeBytes / 1e9).toFixed(1) + ' GB';
      if (s.lastMotion) txt += '  最終検知 ' + new Date(s.lastMotion).toLocaleTimeString();
      if (s.error) txt += '  ⚠ ' + s.error;
      stateEl.textContent = txt;
      stateEl.className = s.state === 'recording' ? 'rec' : '';
      if (s.rotation !== rotation) {
        rotation = s.rotation;
        live.style.transform = 'rotate(' + rotation + 'deg)';
      }
      showRemote(s.remote);
      // Refresh the list when a recording has just finished.
      if (lastState === 'recording' && s.state !== 'recording') loadList();
      lastState = s.state;
    }).catch(function () { stateEl.textContent = '接続できません'; stateEl.className = ''; });
  }

  startLive();
  loadList();
  loadStatus();
  setInterval(loadStatus, 5000);
})();
</script>
</body>
</html>
