<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z4 MotionCam</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 10px 16px; background: #1d1d1d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  #state { font-size: 14px; color: #bbb; }
  #state.rec { color: #ff5a5a; font-weight: bold; }
  #state.off { color: #ffb74d; font-weight: bold; }
  #monToggle { margin-left: auto; font-size: 14px; padding: 7px 12px; }
  #monToggle.on { background: #b3261e; }
  main { max-width: 960px; margin: 0 auto; padding: 12px 16px 40px; }
  .view { position: relative; background: #000; border-radius: 8px; overflow: hidden;
          aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
  @supports not (aspect-ratio: 4 / 3) { .view { height: 70vw; max-height: 720px; } }
  .view img { max-width: 100%; max-height: 100%; }
  .view img:not([src]) { visibility: hidden; } /* no broken-image icon while the stream is stopped */
  .view .msg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
               flex-direction: column; gap: 10px; background: rgba(0,0,0,.6); text-align: center; padding: 16px; }
  button { font-size: 15px; padding: 8px 16px; border-radius: 6px; border: 0; background: #3a6df0; color: #fff; }
  button.secondary { background: #333; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  button.danger, .btn.danger { background: #b3261e; }
  button:disabled { opacity: .4; }
  .btn { display: inline-block; font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 0;
         background: #333; color: #fff; text-decoration: none; line-height: 1.2; cursor: pointer; }
  .toolbar { position: sticky; top: 0; z-index: 1; background: #111; display: flex; flex-wrap: wrap;
             align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid #2a2a2a; }
  .toolbar .all { font-size: 14px; margin-right: auto; }
  .toolbar button { font-size: 14px; padding: 8px 10px; }
  #selInfo { width: 100%; }
  #selInfo:empty { display: none; }
  #notice { min-height: 1.4em; margin: 6px 4px; }
  #notice.err { color: #ff8a80; }
  /* Custom checkbox: same size and look in every browser, with a large tap area. */
  .cb { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
        padding: 8px; margin: -8px; -webkit-tap-highlight-color: transparent; user-select: none; }
  .cb input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .cb .box { width: 24px; height: 24px; flex: none; box-sizing: border-box; border: 2px solid #8a8a8a;
             border-radius: 5px; background: #111; position: relative; }
  .cb input:checked + .box { background: #3a6df0; border-color: #3a6df0; }
  .cb input:checked + .box::after { content: ''; position: absolute; left: 6px; top: 1px; width: 6px; height: 12px;
             border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
  .cb input.partial + .box { background: #3a6df0; border-color: #3a6df0; }
  .cb input.partial + .box::after { content: ''; position: absolute; left: 4px; top: 9px; width: 12px; height: 3px; background: #fff; }
  .cb input:focus-visible + .box { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .cb input:disabled + .box { opacity: .4; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #2a2a2a; }
  li.checked { background: #1a2238; }
  li .dur { flex: none; width: 4.6em; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: #ddd; }
  li .info { flex: 1; min-width: 0; }
  li .info a { color: #8ab4ff; }
  li.playing .info a { font-weight: bold; }
  li .actions { display: flex; gap: 6px; flex: none; }
  .meta { color: #999; font-size: 13px; }
  video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; margin-top: 8px; display: none; }
  .hidden { display: none !important; }
  .panel { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-top: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: #999; }
  .kv dd { margin: 0; word-break: break-all; }
  .fp { font-family: ui-monospace, monospace; font-size: 12px; }
  .sess { padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
  .sess .when { font-weight: bold; }
  .sess.bad .how { color: #ffb74d; font-weight: bold; }
  .scroll { overflow-x: auto; }
  table.samples { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  table.samples th, table.samples td { padding: 4px 8px; border-bottom: 1px solid #2a2a2a; text-align: right; }
  table.samples th { color: #999; font-weight: normal; }
  details summary { cursor: pointer; margin: 10px 0 6px; color: #8ab4ff; }
  .settings h3 { font-size: 15px; margin: 18px 0 6px; color: #bbb; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; }
  .settings .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 8px 0; }
  .settings .row label.name { flex: 1 1 12em; font-size: 14px; }
  .settings select, .settings input[type=text], .settings input[type=password], .settings input[type=number] {
    flex: 1 1 12em; max-width: 22em; font-size: 15px; padding: 6px 8px; border-radius: 6px; border: 1px solid #444;
    background: #1f1f1f; color: #eee; box-sizing: border-box; }
  .settings .note { flex-basis: 100%; font-size: 12px; color: #ffb74d; }
  #settingsMsg.err { color: #ff8a80; }
  #settingsMsg { margin-top: 8px; min-height: 1.4em; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Z4 MotionCam</h1>
  <span id="state">接続中…</span>
  <button type="button" id="monToggle" class="hidden">監視オフ</button>
</header>
<main>
  <div class="view">
    <img id="live" alt="ライブ映像">
    <div id="offMsg" class="msg hidden">
      <div>監視オフ中です（カメラ・動体検知・録画は停止しています）</div>
      <button type="button" id="monOn">監視を開始</button>
    </div>
    <div id="paused" class="msg hidden">
      <div>発熱を抑えるため、ライブ映像は10分で自動停止します</div>
      <button id="resume">ライブ再開</button>
    </div>
  </div>
  <p><button class="secondary" id="toggle">ライブ停止</button></p>

  <!-- The sticky toolbar stays pinned only while this section is on screen. -->
  <section>
  <h2>録画</h2>
  <video id="player" controls playsinline></video>
  <div class="toolbar">
    <label class="cb all"><input type="checkbox" id="selAll"><span class="box"></span>すべて選択</label>
    <button type="button" id="bulkSave" disabled>一括保存</button>
    <button type="button" id="bulkDel" class="danger" disabled>一括削除</button>
    <div id="selInfo" class="meta"></div>
  </div>
  <div id="notice" class="meta" role="status"></div>
  <ul id="list"><li class="meta">読み込み中…</li></ul>
  </section>
  <h2>稼働記録</h2>
  <div class="panel">
    <div id="upNow"></div>
    <p class="meta">1分ごとに「動作中」を記録しています。突然電源が切れた場合も、最後の記録時刻（1分以内の誤差）を終了時刻として残します。</p>
    <div id="sessions"></div>
    <details>
      <summary>電池の記録（直近24時間・5分ごと）</summary>
      <div class="scroll"><table class="samples" id="samples"></table></div>
    </details>
    <p><button type="button" class="secondary" id="upReload">更新</button></p>
  </div>

  <h2>設定</h2>
  <div class="panel">
    <details id="settingsBox">
      <summary>Z4の設定を開く（Z4本体の設定画面と同じ項目）</summary>
      <p class="meta">保存すると数秒でZ4に反映されます。反映中はライブ映像が一瞬止まります。</p>
      <div class="settings" id="settingsForm">読み込み中…</div>
      <p><button type="button" id="saveSettings">保存</button></p>
      <div id="settingsMsg" class="meta"></div>
    </details>
  </div>

  <h2>外出先からの視聴</h2>
  <div class="panel">
    <dl class="kv" id="remoteKv"></dl>
    <p class="meta" id="remoteHint"></p>
  </div>

  <!-- Bulk save posts the names so the browser streams the ZIP straight to a download. -->
  <form id="zipForm" method="post" action="/api/zip" class="hidden">
    <input type="hidden" name="names">
  </form>
</main>
<script>
// ES5 + XMLHttpRequest only, so older phones / tablets and WebView-based browsers work too.
(function () {
  'use strict';
  var LIVE_LIMIT_MS = 10 * 60 * 1000;
  var MAX_ZIP_BYTES = 3.9e9; // the phone cannot write ZIP files over 4 GB (no ZIP64 before Android 7)

  function $(id) { return document.getElementById(id); }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function show(e, on) {
    if (on) e.className = e.className.replace(/(^|\s)hidden(\s|$)/g, ' ').replace(/^\s+|\s+$/g, '');
    else if (!/(^|\s)hidden(\s|$)/.test(e.className)) e.className += ' hidden';
  }
  function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB'; }
  function fmtName(n) {
    var m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(n);
    return m ? m[1] + '/' + m[2] + '/' + m[3] + ' ' + m[4] + ':' + m[5] + ':' + m[6] : n;
  }
  function recUrl(name) { return '/rec/' + encodeURIComponent(name); }
  // Recording length, e.g. "2分05秒" / "45秒"; "--" when unknown.
  function fmtLen(ms) {
    if (!(ms >= 0)) return '--';
    var sec = Math.round(ms / 1000), m = Math.floor(sec / 60), s2 = sec % 60;
    return m > 0 ? m + '分' + (s2 < 10 ? '0' : '') + s2 + '秒' : s2 + '秒';
  }

  // cb(err, text) - on an HTTP error, text is still the response body (for the error message)
  function request(method, url, body, headers, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    for (var k in headers) if (headers.hasOwnProperty(k)) x.setRequestHeader(k, headers[k]);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) cb(null, x.responseText);
      else cb(new Error(x.status ? 'HTTP ' + x.status : '通信エラー'), x.responseText);
    };
    x.send(body === undefined ? null : body);
  }
  function getJson(url, cb) {
    // Cache-busting: some mobile browsers reuse cached GET responses despite no-cache.
    request('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), undefined, {}, function (err, text) {
      if (err) return cb(err);
      var data;
      try { data = JSON.parse(text); } catch (e) { return cb(e); }
      cb(null, data);
    });
  }

  // ---- live view ----
  var live = $('live'), paused = $('paused'), toggle = $('toggle'), stateEl = $('state'), player = $('player');
  var liveTimer = null, liveOn = false, rotation = 0;
  var monitoringOn = true;
  function startLive() {
    if (!monitoringOn) return; // camera is off: nothing to stream
    live.src = '/stream.mjpg?t=' + new Date().getTime();
    liveOn = true;
    show(paused, false);
    toggle.textContent = 'ライブ停止';
    clearTimeout(liveTimer);
    liveTimer = setTimeout(stopLive, LIVE_LIMIT_MS);
  }
  function stopLive() {
    live.removeAttribute('src');
    liveOn = false;
    show(paused, true);
    toggle.textContent = 'ライブ再開';
    clearTimeout(liveTimer);
  }
  toggle.onclick = function () { if (liveOn) stopLive(); else startLive(); };
  $('resume').onclick = startLive;
  // Stop streaming when the tab is hidden: the phone only encodes JPEGs while someone watches.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLive(); else startLive();
  });

  // ---- recordings: list, selection, save / delete ----
  var listEl = $('list'), selAll = $('selAll'), bulkSave = $('bulkSave'), bulkDel = $('bulkDel');
  var selInfo = $('selInfo'), notice = $('notice'), zipForm = $('zipForm');
  var items = [];        // [{name, size, modified}], newest first
  var selected = {};     // name -> true
  var playing = null;
  var busy = false;

  function say(text, isError) {
    notice.textContent = text || '';
    notice.className = 'meta' + (isError ? ' err' : '');
  }

  function selectedNames() {
    var out = [];
    for (var i = 0; i < items.length; i++) if (selected[items[i].name]) out.push(items[i].name);
    return out;
  }

  function updateToolbar() {
    var names = selectedNames(), size = 0;
    for (var i = 0; i < items.length; i++) if (selected[items[i].name]) size += items[i].size;
    bulkSave.disabled = bulkDel.disabled = busy || names.length === 0;
    bulkSave.textContent = names.length ? '一括保存（' + names.length + '）' : '一括保存';
    bulkDel.textContent = names.length ? '一括削除（' + names.length + '）' : '一括削除';
    selAll.disabled = busy || items.length === 0;
    selAll.checked = items.length > 0 && names.length === items.length;
    // Own "partial" state instead of .indeterminate, which some browsers do not draw.
    selAll.className = names.length > 0 && names.length < items.length ? 'partial' : '';
    selInfo.textContent = names.length ? names.length + '件選択中（' + fmtSize(size) + '）' : '';
    var boxes = listEl.getElementsByTagName('input');
    for (var j = 0; j < boxes.length; j++) boxes[j].disabled = busy;
    var buttons = listEl.getElementsByTagName('button');
    for (var k = 0; k < buttons.length; k++) buttons[k].disabled = busy;
  }

  function rowClass(name) {
    return (selected[name] ? 'checked' : '') + (playing === name ? ' playing' : '');
  }

  function render() {
    listEl.textContent = '';
    if (!items.length) listEl.appendChild(el('li', 'まだ録画はありません', 'meta'));
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var li = el('li', null, rowClass(it.name));
      li.setAttribute('data-name', it.name);

      var label = el('label', null, 'cb');
      var chk = el('input');
      chk.type = 'checkbox';
      chk.checked = !!selected[it.name];
      chk.setAttribute('data-name', it.name);
      chk.setAttribute('aria-label', fmtName(it.name) + ' を選択');
      label.appendChild(chk);
      label.appendChild(el('span', null, 'box'));

      var dur = el('div', fmtLen(it.duration), 'dur');
      dur.title = '録画時間';

      var info = el('div', null, 'info');
      var play = el('a', fmtName(it.name));
      play.href = recUrl(it.name);
      play.setAttribute('data-action', 'play');
      info.appendChild(play);
      info.appendChild(el('div', fmtSize(it.size), 'meta'));

      var actions = el('div', null, 'actions');
      var save = el('a', '保存', 'btn');
      save.href = recUrl(it.name) + '?dl=download';
      save.setAttribute('download', it.name);
      var del = el('button', '削除', 'btn danger');
      del.type = 'button';
      del.setAttribute('data-action', 'delete');
      actions.appendChild(save);
      actions.appendChild(del);

      li.appendChild(label);
      li.appendChild(dur);
      li.appendChild(info);
      li.appendChild(actions);
      listEl.appendChild(li);
    }
    updateToolbar();
  }

  function loadList(done) {
    getJson('/api/recordings', function (err, data) {
      if (err) {
        say('録画一覧を読み込めません（' + err.message + '）', true);
      } else {
        items = data;
        var present = {}, i;
        for (i = 0; i < items.length; i++) present[items[i].name] = true;
        // Forget selections of files that no longer exist (e.g. removed by the storage rotation).
        for (var n in selected) if (selected.hasOwnProperty(n) && !present[n]) delete selected[n];
      }
      render(); // always, so buttons are re-enabled even after an error
      if (done) done();
    });
  }

  // One listener for all rows (rows are rebuilt on every refresh).
  function rowName(node) {
    while (node && node !== listEl) {
      if (node.getAttribute && node.getAttribute('data-name')) return node.getAttribute('data-name');
      node = node.parentNode;
    }
    return null;
  }
  listEl.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || t.type !== 'checkbox') return;
    var name = t.getAttribute('data-name');
    if (t.checked) selected[name] = true; else delete selected[name];
    var node = t;
    while (node && node.tagName !== 'LI') node = node.parentNode;
    if (node) node.className = rowClass(name);
    updateToolbar();
  });
  listEl.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== listEl && !(t.getAttribute && t.getAttribute('data-action'))) t = t.parentNode;
    if (!t || t === listEl) return;
    var name = rowName(t);
    if (!name) return;
    var action = t.getAttribute('data-action');
    if (action === 'play') {
      ev.preventDefault();
      playing = name;
      player.style.display = 'block';
      player.src = recUrl(name);
      try { player.play(); } catch (e) { /* autoplay may be refused; controls remain */ }
      if (player.scrollIntoView) player.scrollIntoView();
      render();
    } else if (action === 'delete') {
      ev.preventDefault();
      deleteFiles([name]);
    }
  });

  selAll.addEventListener('change', function () {
    // From "partial" or "none" -> select all; from "all" -> clear.
    var selectAll = selAll.checked;
    selected = {};
    if (selectAll) for (var i = 0; i < items.length; i++) selected[items[i].name] = true;
    render();
  });

  function download(url, name) {
    var a = el('a');
    a.href = url;
    a.setAttribute('download', name);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function saveFiles(names) {
    if (!names.length) { say('チェックされた録画がありません', true); return; }
    if (names.length === 1) { download(recUrl(names[0]) + '?dl=download', names[0]); return; }
    var total = 0;
    for (var i = 0; i < items.length; i++) if (selected[items[i].name]) total += items[i].size;
    if (total > MAX_ZIP_BYTES) {
      say('選択したファイルの合計が大きすぎます（一括保存は3.9GBまで）。選択を減らしてください。', true);
      return;
    }
    zipForm.elements.names.value = names.join('\n');
    zipForm.submit();
    say(names.length + '件をZIPにまとめて保存します（無圧縮）…');
  }

  function stopPlayerIf(names) {
    for (var i = 0; i < names.length; i++) {
      if (playing === names[i]) {
        playing = null;
        player.pause();
        player.removeAttribute('src');
        try { player.load(); } catch (e) { /* ignore */ }
        player.style.display = 'none';
      }
    }
  }

  function deleteFiles(names) {
    if (busy) return;
    if (!names.length) { say('チェックされた録画がありません', true); return; }
    var msg = names.length === 1
      ? '「' + fmtName(names[0]) + '」を削除しますか？\n削除すると元に戻せません。'
      : names.length + '件の録画を削除しますか？\n削除すると元に戻せません。';
    if (!window.confirm(msg)) return;
    busy = true;
    updateToolbar();
    say('削除しています…');
    stopPlayerIf(names); // release the file before deleting it
    request('POST', '/api/delete', names.join('\n'),
      { 'Content-Type': 'text/plain; charset=utf-8', 'X-Z4-Action': 'delete' },
      function (err, text) {
        var message, isError = false;
        if (err) {
          message = '削除に失敗しました（' + err.message + '）';
          isError = true;
        } else {
          var res;
          try { res = JSON.parse(text); } catch (e) { res = { deleted: [], failed: names }; }
          for (var i = 0; i < res.deleted.length; i++) delete selected[res.deleted[i]];
          message = res.deleted.length + '件削除しました';
          if (res.failed.length) {
            message += '（' + res.failed.length + '件は削除できませんでした）';
            isError = true;
          }
        }
        busy = false;
        loadList(function () { say(message, isError); });
      });
  }

  bulkSave.addEventListener('click', function () { saveFiles(selectedNames()); });
  bulkDel.addEventListener('click', function () { deleteFiles(selectedNames()); });

  // ---- remote access ----
  var remoteKv = $('remoteKv'), remoteHint = $('remoteHint');

  function fillKv(dl, rows) {
    dl.textContent = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r[1] === null || r[1] === undefined || r[1] === '') continue;
      dl.appendChild(el('dt', r[0]));
      var dd = el('dd', null, r[2] || '');
      if (/^https:\/\//.test(r[1])) {
        var a = el('a', r[1]);
        a.href = r[1];
        a.style.color = '#8ab4ff';
        dd.appendChild(a);
      } else {
        dd.textContent = r[1];
      }
      dl.appendChild(dd);
    }
  }

  function showRemote(r) {
    if (!r || !r.enabled) {
      fillKv(remoteKv, [['状態', '無効']]);
      remoteHint.textContent = 'Z4の「設定 > 外出先からの視聴」で有効にできます（8文字以上のパスワードが必要）。';
      return;
    }
    fillKv(remoteKv, [
      ['状態', r.state + (r.error ? '（' + r.error + '）' : '')],
      ['外出先URL', r.url],
      ['ポート開放', r.upnp],
      ['DDNS', r.ddns],
      ['ルーターのグローバルIP', r.wanIp],
      ['証明書', r.cert],
      ['証明書の指紋', r.certIssued ? null : r.fingerprint, 'fp']
    ]);
    remoteHint.textContent = !r.active ? ''
      : r.certIssued
      ? '外出先では上のURLをモバイル回線で開きます。正規の証明書なので警告は出ません。Google スプレッドシートのビューアにも、このドメイン名で登録します。'
      : '外出先では上のURLをモバイル回線で開きます。初回は「保護されていない通信」と警告が出るので、証明書の指紋（SHA-256）が上と一致することを確かめてから進んでください。';
  }

  // ---- uptime log ----
  var BAD_END = { '突然の電源断（シャットダウン通知なし）': true, 'アプリだけが強制終了（端末は動作継続）': true };
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtTime(ms) {
    var d = new Date(ms);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDur(min) { return Math.floor(min / 60) + '時間' + pad2(min % 60) + '分'; }
  function fmtSnap(x) {
    var parts = [];
    if (x.battery >= 0) parts.push('電池 ' + x.battery + '%');
    if (x.tempC !== null) parts.push(x.tempC.toFixed(1) + '℃');
    if (x.voltageMv > 0) parts.push((x.voltageMv / 1000).toFixed(2) + 'V');
    if (x.power) parts.push(x.power);
    if (x.health && x.health !== '良好') parts.push('電池状態: ' + x.health);
    if (x.thermal) parts.push('負荷制御 ' + x.thermal);
    return parts.join('・');
  }
  function loadUptime() {
    getJson('/api/uptime', function (err, u) {
      var now = $('upNow');
      if (err) { now.textContent = '稼働記録を読み込めません'; return; }
      now.textContent = '現在: ' + fmtDur(u.current.minutes) + ' 稼働中（' + fmtTime(u.current.start) + ' から）';
      var box = $('sessions');
      box.textContent = '';
      if (!u.sessions.length) box.appendChild(el('div', '過去の記録はまだありません', 'meta'));
      for (var i = 0; i < u.sessions.length && i < 30; i++) {
        var x = u.sessions[i];
        var d = el('div', null, 'sess' + (BAD_END[x.reason] ? ' bad' : ''));
        d.appendChild(el('div', fmtTime(x.start) + ' → ' + fmtTime(x.end) + '（' + fmtDur(x.minutes) + '）', 'when'));
        d.appendChild(el('div', '終わり方: ' + x.reason, 'how'));
        d.appendChild(el('div', '直前の状態: ' + fmtSnap(x.last), 'meta'));
        box.appendChild(d);
      }
      var t = $('samples');
      t.textContent = '';
      var head = el('tr');
      var cols = ['時刻', '電池', '温度', '電圧', '充電', '負荷制御', '録画'];
      for (var c = 0; c < cols.length; c++) head.appendChild(el('th', cols[c]));
      t.appendChild(head);
      for (var j = 0; j < u.samples.length; j++) {
        var s = u.samples[j], tr = el('tr');
        var cells = [fmtTime(s.t), s.battery >= 0 ? s.battery + '%' : '-', s.tempC !== null ? s.tempC.toFixed(1) + '℃' : '-',
          s.voltageMv > 0 ? (s.voltageMv / 1000).toFixed(2) + 'V' : '-', s.power || '-', s.thermal || '-', s.recording ? '●' : ''];
        for (var k = 0; k < cells.length; k++) tr.appendChild(el('td', cells[k]));
        t.appendChild(tr);
      }
      if (!u.samples.length) {
        var empty = el('tr');
        empty.appendChild(el('td', '5分ごとに記録されます'));
        t.appendChild(empty);
      }
    });
  }
  $('upReload').addEventListener('click', loadUptime);

  // ---- settings (same items as the phone's settings screen) ----
  var settingsForm = $('settingsForm'), settingsMsg = $('settingsMsg'), saveSettings = $('saveSettings');
  var settingFields = [];   // [{f, input}]
  var settingsLoaded = false;

  function settingsSay(text, isError) {
    settingsMsg.textContent = text || '';
    settingsMsg.className = 'meta' + (isError ? ' err' : '');
  }

  function renderSettings(data) {
    settingsForm.textContent = '';
    settingFields = [];
    for (var g = 0; g < data.groups.length; g++) {
      var grp = data.groups[g];
      settingsForm.appendChild(el('h3', grp.title));
      for (var i = 0; i < grp.fields.length; i++) {
        var f = grp.fields[i], row = el('div', null, 'row'), input, id = 'set_' + f.key;
        var name = el('label', f.label, 'name');
        name.setAttribute('for', id);
        if (f.type === 'LIST') {
          input = el('select');
          for (var k = 0; k < f.options.length; k++) {
            var o = el('option', f.options[k].l);
            o.value = f.options[k].v;
            if (f.options[k].v === f.value) o.selected = true;
            input.appendChild(o);
          }
        } else if (f.type === 'BOOL') {
          var wrap = el('label', null, 'cb');
          input = el('input');
          input.type = 'checkbox';
          input.checked = f.value === 'true';
          wrap.appendChild(input);
          wrap.appendChild(el('span', null, 'box'));
        } else {
          input = el('input');
          input.type = f.type === 'SECRET' ? 'password' : (f.type === 'INT' ? 'number' : 'text');
          if (f.type === 'INT') { input.min = f.min; input.max = f.max; input.setAttribute('inputmode', 'numeric'); }
          if (f.type === 'SECRET') {
            input.placeholder = f.set ? '設定済み（変更するときだけ入力）' : '未設定';
            input.autocomplete = 'new-password';
          } else {
            input.value = f.value;
          }
          input.setAttribute('autocapitalize', 'off');
        }
        input.id = id;
        row.appendChild(name);
        row.appendChild(f.type === 'BOOL' ? input.parentNode : input);
        if (f.conn) row.appendChild(el('div', '※ 変更すると、今の接続が切れることがあります', 'note'));
        settingsForm.appendChild(row);
        settingFields.push({ f: f, input: input });
      }
    }
  }

  function loadSettings() {
    getJson('/api/settings', function (err, data) {
      if (err) { settingsForm.textContent = '設定を読み込めません（' + err.message + '）'; return; }
      settingsLoaded = true;
      renderSettings(data);
    });
  }

  function changedSettings() {
    var out = [];
    for (var i = 0; i < settingFields.length; i++) {
      var f = settingFields[i].f, input = settingFields[i].input, v;
      if (f.type === 'BOOL') v = input.checked ? 'true' : 'false';
      else v = input.value;
      if (f.type === 'SECRET' ? v !== '' : v !== f.value) out.push({ f: f, v: v });
    }
    return out;
  }

  $('settingsBox').addEventListener('toggle', function () {
    if ($('settingsBox').open && !settingsLoaded) loadSettings();
  });

  saveSettings.addEventListener('click', function () {
    var changes = changedSettings();
    if (!changes.length) { settingsSay('変更はありません'); return; }
    var conn = false, body = [], newPort = null, newRemotePort = null;
    for (var i = 0; i < changes.length; i++) {
      if (changes[i].f.conn) conn = true;
      if (changes[i].f.key === 'port') newPort = changes[i].v;
      if (changes[i].f.key === 'remote_port') newRemotePort = changes[i].v;
      body.push(encodeURIComponent(changes[i].f.key) + '=' + encodeURIComponent(changes[i].v));
    }
    if (conn && !window.confirm('接続に関わる設定を変更します。今の接続が切れることがあります。保存しますか？')) return;
    saveSettings.disabled = true;
    settingsSay('保存しています…');
    request('POST', '/api/settings', body.join('&'),
      { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Z4-Action': 'settings' },
      function (err, text) {
        saveSettings.disabled = false;
        if (err) {
          var msg = err.message;
          try { msg = JSON.parse(text || '{}').error || msg; } catch (e) { /* keep */ }
          settingsSay('保存できませんでした（' + msg + '）', true);
          return;
        }
        settingsSay(changes.length + '件の設定を保存しました。数秒でZ4に反映されます。');
        // The saved values are now the current ones (secrets are never shown again).
        for (var c = 0; c < changes.length; c++) {
          if (changes[c].f.type === 'SECRET') {
            changes[c].f.set = true;
            for (var j = 0; j < settingFields.length; j++) {
              if (settingFields[j].f === changes[c].f) {
                settingFields[j].input.value = '';
                settingFields[j].input.placeholder = '設定済み（変更するときだけ入力）';
              }
            }
          } else {
            changes[c].f.value = changes[c].v;
          }
        }
        // Follow a port change made on the connection this page uses.
        var here = location.port;
        var target = null;
        if (newPort && location.protocol === 'http:' && here !== newPort) target = 'http://' + location.hostname + ':' + newPort + '/';
        if (newRemotePort && location.protocol === 'https:' && here !== newRemotePort) target = 'https://' + location.hostname + ':' + newRemotePort + '/';
        setTimeout(function () {
          if (target) { location.href = target; return; }
          loadSettings();
          loadStatus();
          if (liveOn) startLive(); // the stream restarts with the camera
        }, 3000);
      });
  });

  // ---- status ----
  var STATE = { recording: '● 録画中', watching: '監視中', starting: 'カメラ準備中',
                cooling: '高温のため一時停止中', stopped: '停止中', paused: '■ 監視オフ' };

  // ---- monitoring on/off ----
  var monToggle = $('monToggle'), offMsg = $('offMsg');
  function showMonitoring(on) {
    show(monToggle, true);
    monToggle.textContent = on ? '監視オフ' : '監視オン';
    monToggle.className = on ? 'on' : '';
    if (on === monitoringOn) return;
    monitoringOn = on;
    show(offMsg, !on);
    show(toggle.parentNode, on); // "live stop/resume" is meaningless while the camera is off
    if (on) {
      startLive();
    } else {
      stopLive();
      show(paused, false); // the "live stopped" message is not relevant while off
    }
  }
  function setMonitoring(on) {
    if (!on && !window.confirm('監視をオフにしますか？\nカメラを止め、動体検知・録画・ライブ映像も止まります。\nZ4の画面は暗いまま待機し、この画面からいつでもオンに戻せます。')) return;
    monToggle.disabled = true;
    request('POST', '/api/monitoring', 'on=' + on, { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Z4-Action': 'monitoring' },
      function (err) {
        monToggle.disabled = false;
        if (err) { window.alert('切り替えられませんでした（' + err.message + '）'); return; }
        showMonitoring(on);
        setTimeout(loadStatus, 1500);
      });
  }
  monToggle.addEventListener('click', function () { setMonitoring(!monitoringOn); });
  $('monOn').addEventListener('click', function () { setMonitoring(true); });
  var lastState = '';
  function loadStatus() {
    getJson('/api/status', function (err, s) {
      if (err) { stateEl.textContent = '接続できません'; stateEl.className = ''; return; }
      var txt = (STATE[s.state] || s.state) + '  電池 ' + (s.battery >= 0 ? s.battery + '%・' : '') + s.tempC.toFixed(1) + '℃'
        + (s.power ? '（' + s.power + '）' : (s.charging ? '（充電中）' : '')) + '  空き ' + (s.freeBytes / 1e9).toFixed(1) + ' GB';
      if (s.lastMotion) txt += '  最終検知 ' + new Date(s.lastMotion).toLocaleTimeString();
      if (s.error) txt += '  ⚠ ' + s.error;
      stateEl.textContent = txt;
      stateEl.className = s.state === 'recording' ? 'rec' : (s.state === 'paused' ? 'off' : '');
      if (typeof s.monitoring === 'boolean') showMonitoring(s.monitoring);
      if (s.rotation !== rotation) {
        rotation = s.rotation;
        live.style.webkitTransform = live.style.transform = 'rotate(' + rotation + 'deg)';
      }
      showRemote(s.remote);
      // Refresh the list when a recording has just finished (not while a delete is running).
      if (lastState === 'recording' && s.state !== 'recording' && !busy) loadList();
      lastState = s.state;
    });
  }

  startLive();
  loadList();
  loadStatus();
  loadUptime();
  setInterval(loadStatus, 5000);
  setInterval(loadUptime, 5 * 60 * 1000);
})();
</script>
</body>
</html>
