<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タチコマ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="layout">
  <section class="stage" aria-label="タチコマ">
    <div class="toolbar" role="group" aria-label="カメラとマイク">
      <button class="switch" type="button" role="switch" aria-checked="false" data-dev="camera">
        <span class="track"><span class="knob"></span></span>
        <span class="sw-label">カメラ</span><span class="sw-state">-</span>
      </button>
      <button class="switch" type="button" role="switch" aria-checked="false" data-dev="mic">
        <span class="track"><span class="knob"></span></span>
        <span class="sw-label">マイク</span><span class="sw-state">-</span>
      </button>
      <span class="spacer"></span>
      <button class="tool" type="button" id="pick" title="タチコマの画像を選ぶ (背景はこの PC の中で自動で抜きます)">画像を変える</button>
      <button class="tool quiet" type="button" id="reset" title="同梱の仮の絵に戻す">元に戻す</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </div>
    <p class="note" id="note" hidden></p>

    <div class="floor" id="floor">
      <div class="bubble" id="bubble" hidden></div>
      <div class="mover" id="mover">
        <div class="avatar-wrap expr-idle" id="avatar">
          <img id="avatar-img" src="/static/avatar.svg" alt="タチコマ" draggable="false">
          <div class="sheen" id="sheen" aria-hidden="true"></div>
          <span class="badge" id="badge" aria-hidden="true"></span>
          <span class="zzz" aria-hidden="true">z z Z</span>
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="waves" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="shadow" aria-hidden="true"></div>
      </div>
    </div>
    <div class="activity" id="activity">起動中…</div>
  </section>

  <section class="talk" aria-label="会話">
    <ol class="log" id="log"></ol>
    <form class="input" id="form">
      <input id="text" autocomplete="off" placeholder="タチコマに話しかける…" aria-label="メッセージ">
      <button type="submit">送る</button>
    </form>
  </section>
</main>

<footer class="status">
  <span><b>注意</b> <em id="st-mode">-</em></span>
  <span><b>耳</b> CER <em id="st-ear">-</em></span>
  <span><b>目</b> CER <em id="st-eye">-</em></span>
  <span><b>電力</b> <em id="st-w">-</em></span>
  <span><b>モデル</b> <em id="st-model">-</em></span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
