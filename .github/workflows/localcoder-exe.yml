name: Build LocalCoder.exe

# extras/localcoder を Windows 用の 1 つのアプリ (LocalCoder.exe) にし、実物の llama.cpp と小さなモデルで
# 「日本語で頼む → ファイルができる」までを通しで確かめる。
on:
  push:
    paths:
      - "extras/localcoder/**"
      - ".github/workflows/localcoder-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: extras/localcoder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build LocalCoder.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name LocalCoder LocalCoder.py

      - name: Show llama.cpp Windows builds in recent releases
        run: |
          $r = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=3"
          foreach ($x in $r) { "== $($x.tag_name)"; $x.assets.name | Where-Object { $_ -like "*win*" } }

      - name: "End to end: real llama.cpp (CPU) + small model, one Japanese request"
        run: |
          $h = "$env:RUNNER_TEMP\lc"
          $ws = "$env:RUNNER_TEMP\ws"
          $a = @("--home", $h, "--config", "$env:RUNNER_TEMP\lc.json", "--model", "tiny", "--kinds", "cpu",
                 "--no-toolchain", "--ctx", "8192", "--workspace", $ws, "--yes",
                 "--task", "hello.txt というファイルを作って、中身を「こんにちは」の 1 行にしてください。")
          & dist\LocalCoder.exe @a 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\e2e.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\e2e.txt"
          if (Test-Path "$h\logs\llama-server.log") { Get-Content "$h\logs\llama-server.log" -Tail 20 }
          if ($code -ne 0) { throw "LocalCoder failed ($code)" }
          if (-not (Test-Path "$ws\hello.txt")) { throw "hello.txt was not created" }
          Get-Content "$ws\hello.txt"
          exit 0

      - name: "Toolchain: install Python into the chosen folder and build an .exe with it"
        run: |
          $h = "$env:RUNNER_TEMP\lc"
          python -c "import sys; sys.path.insert(0, '.'); from localcoder import toolchain; exe = toolchain.ensure(r'$h'); print(exe); assert exe"
          $py = "$h\python\python.exe"
          if (-not (Test-Path $py)) { throw "python was not installed into the folder" }
          Set-Content -Path "$env:RUNNER_TEMP\hi.py" -Value "print('hi from exe')"
          & $py -m PyInstaller --onefile --noconfirm --distpath "$env:RUNNER_TEMP\dist" --workpath "$env:RUNNER_TEMP\build" `
            --specpath "$env:RUNNER_TEMP" "$env:RUNNER_TEMP\hi.py"
          $out = & "$env:RUNNER_TEMP\dist\hi.exe"
          if ($out -ne "hi from exe") { throw "built exe printed: $out" }
          & $py -c "import tkinter; print('tkinter ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalCoder-windows
          path: extras/localcoder/dist/LocalCoder.exe
          retention-days: 30
