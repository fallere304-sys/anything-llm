name: Build LocalCoder.exe

# extras/localcoder を Windows 用のアプリ (LocalCoder.exe = 画面、LocalCoderCLI.exe = コマンドプロンプト) にし、実物の llama.cpp と小さなモデルで
# 「日本語で頼む → ファイルができる」までを通しで確かめる。
on:
  push:
    paths:
      - "extras/localcoder/**"
      - ".github/workflows/localcoder-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: extras/localcoder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build LocalCoder.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name LocalCoder LocalCoder.py
          pyinstaller --noconfirm --clean --onefile --console --name LocalCoderCLI LocalCoderCLI.py
          pyinstaller --noconfirm --clean --onefile --console --name LocalCoderUninstall LocalCoderUninstall.py

      - name: "Window: the built LocalCoder.exe opens its window, shows progress and stops on request"
        timeout-minutes: 5
        run: |
          $out = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath dist\LocalCoder.exe -ArgumentList @("--selftest", $out, "--config", "$env:RUNNER_TEMP\st.json") -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "window selftest failed ($($p.ExitCode))" }

      - name: "End to end: real llama.cpp (CPU) + small model, one Japanese request"
        env:
          GITHUB_TOKEN: ${{ github.token }}      # 共有の実行環境では、名前なしの API は回数制限にかかる
        run: |
          $h = "$env:RUNNER_TEMP\lc"
          $ws = "$env:RUNNER_TEMP\ws"
          # 利用者と同じく、ダウンロードした場所から動かす (取り除くときに、この写しも消えることを確かめる)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\app" | Out-Null
          Copy-Item dist\LocalCoderCLI.exe "$env:RUNNER_TEMP\app\LocalCoderCLI.exe"
          $a = @("--home", $h, "--config", "$env:RUNNER_TEMP\lc.json", "--model", "small", "--kinds", "cpu",
                 "--no-toolchain", "--ctx", "8192", "--workspace", $ws, "--yes",
                 "--task", "hello.txt というファイルを作って、中身を「こんにちは」の 1 行にしてください。")
          & "$env:RUNNER_TEMP\app\LocalCoderCLI.exe" @a 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\e2e.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\e2e.txt"
          if (Test-Path "$h\logs\llama-server.log") { Get-Content "$h\logs\llama-server.log" -Tail 20 }
          if ($code -ne 0) { throw "LocalCoder failed ($code)" }
          if (-not (Test-Path "$ws\hello.txt")) { throw "hello.txt was not created" }
          Get-Content "$ws\hello.txt"
          exit 0

      - name: "Toolchain: install Python into the chosen folder and build an .exe with it"
        run: |
          $h = "$env:RUNNER_TEMP\lc"
          & {
            "--- $args"
            "toolcache python.exe: $(Test-Path "$env:pythonLocation\python.exe")"
            foreach ($hive in "HKLM:", "HKCU:") {
              foreach ($k in "$hive\SOFTWARE\Python\PythonCore\3.12\InstallPath") {
                if (Test-Path $k) { "$k = $((Get-ItemProperty $k).'(default)')" }
              }
              foreach ($u in "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall", "$hive\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall") {
                if (Test-Path $u) { Get-ChildItem $u | Where-Object { $_.GetValue("DisplayName") -like "Python 3.12*" } |
                  ForEach-Object { "$($_.PSChildName) | $($_.GetValue('DisplayName')) | $($_.GetValue('BundleCachePath'))$($_.GetValue('InstallLocation'))" } }
              }
            }
          } "before toolchain"
          $py = python -c "import sys; sys.path.insert(0, '.'); from localcoder import toolchain; exe = toolchain.ensure(r'$h', say=lambda *a, **k: print(*a, file=sys.stderr)); print(exe or '')"
          "python for the tools: $py"
          if (-not $py -or -not (Test-Path $py) -or -not $py.StartsWith("$h\python")) { throw "python was not prepared inside the folder" }
          # この機械にはもともと Python 3.12 がある: 公式の入れる道具は使わず (もとの Python を動かしてしまう)、仮想環境を作るはず
          if (-not (Test-Path "$env:pythonLocation\python.exe")) { throw "the Python that was already here was damaged" }
          if (-not (Test-Path "HKLM:\SOFTWARE\Python\PythonCore\3.12\InstallPath")) { throw "the existing Python registration was damaged" }
          Set-Content -Path "$env:RUNNER_TEMP\hi.py" -Value "print('hi from exe')"
          & $py -m PyInstaller --onefile --noconfirm --distpath "$env:RUNNER_TEMP\dist" --workpath "$env:RUNNER_TEMP\build" `
            --specpath "$env:RUNNER_TEMP" "$env:RUNNER_TEMP\hi.py"
          $out = & "$env:RUNNER_TEMP\dist\hi.exe"
          if ($out -ne "hi from exe") { throw "built exe printed: $out" }
          & $py -c "import tkinter; print('tkinter ok')"
          & {
            "--- $args"
            "toolcache python.exe: $(Test-Path "$env:pythonLocation\python.exe")"
            foreach ($hive in "HKLM:", "HKCU:") {
              foreach ($k in "$hive\SOFTWARE\Python\PythonCore\3.12\InstallPath") {
                if (Test-Path $k) { "$k = $((Get-ItemProperty $k).'(default)')" }
              }
              foreach ($u in "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall", "$hive\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall") {
                if (Test-Path $u) { Get-ChildItem $u | Where-Object { $_.GetValue("DisplayName") -like "Python 3.12*" } |
                  ForEach-Object { "$($_.PSChildName) | $($_.GetValue('DisplayName')) | $($_.GetValue('BundleCachePath'))$($_.GetValue('InstallLocation'))" } }
              }
            }
          } "after toolchain"

      - name: "Uninstall: back to the state before LocalCoder"
        run: |
          $h = "$env:RUNNER_TEMP\lc"
          $cfg = "$env:RUNNER_TEMP\lc.json"
          $core = "HKCU:\Software\Python\PythonCore\3.12\InstallPath"
          Get-Content $cfg
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\un" | Out-Null
          Copy-Item dist\LocalCoderUninstall.exe "$env:RUNNER_TEMP\un\"
          & "$env:RUNNER_TEMP\un\LocalCoderUninstall.exe" --config $cfg --dry-run 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\un1.txt"
          Get-Content "$env:RUNNER_TEMP\un1.txt"
          if (-not (Test-Path "$h\models")) { throw "--dry-run removed something" }
          & "$env:RUNNER_TEMP\un\LocalCoderUninstall.exe" --config $cfg --yes --all 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\un2.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\un2.txt"
          if ($code -ne 0) { throw "uninstall failed ($code)" }
          if (Test-Path $h) { Get-ChildItem -Recurse $h | Select-Object -First 20; throw "the folder is still there" }
          if (Test-Path $cfg) { throw "config is still there" }
          if (Test-Path "$env:RUNNER_TEMP\app\LocalCoderCLI.exe") { throw "LocalCoderCLI.exe is still there" }
          if ((Test-Path $core) -and "$((Get-ItemProperty $core).'(default)')".StartsWith($h)) { throw "Python is still registered" }
          & {
            "toolcache python.exe: $(Test-Path "$env:pythonLocation\python.exe")"
            foreach ($hive in "HKLM:", "HKCU:") {
              $k = "$hive\SOFTWARE\Python\PythonCore\3.12\InstallPath"
              if (Test-Path $k) { "$k = $((Get-ItemProperty $k).'(default)')" }
            }
          }
          python --version                     # もとからあった Python は無事
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:pythonLocation\python.exe")) { throw "the Python that was already here was damaged" }
          & "$env:RUNNER_TEMP\un\LocalCoderUninstall.exe" --home $h --yes 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\un3.txt"
          Get-Content "$env:RUNNER_TEMP\un3.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\un3.txt" -Pattern "もう何もありません" -Quiet)) { throw "second run found leftovers" }
          exit 0

      - name: "USB all-in-one: make it on a connected PC"
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $usb = "$env:RUNNER_TEMP\USB\LocalCoder"
          & dist\LocalCoderCLI.exe --make-bundle $usb --models small --kinds "cuda,vulkan,cpu" 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\mk.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\mk.txt"
          if ($code -ne 0) { throw "make-bundle failed ($code)" }
          foreach ($f in "LocalCoder.exe", "LocalCoderCLI.exe", "LocalCoderUninstall.exe", "非常停止.bat", "はじめにお読みください.txt", "bundle\manifest.json") {
            if (-not (Test-Path "$usb\$f")) { throw "missing on the USB: $f" }
          }
          Get-Content "$usb\bundle\manifest.json"
          Get-ChildItem -Recurse "$usb" | Measure-Object -Property Length -Sum | ForEach-Object { "USB size: {0:N1} GB" -f ($_.Sum / 1GB) }

      - name: "USB all-in-one: install and use with the network cut off"
        timeout-minutes: 40
        run: |
          $usb = "$env:RUNNER_TEMP\USB\LocalCoder"
          $h = "$env:RUNNER_TEMP\offline-home"
          $cfg = "$env:RUNNER_TEMP\offline.json"
          $ws = "$env:RUNNER_TEMP\offline-ws"
          # 外へ出られないようにする: 使えない proxy と、USB の exe からの外向き通信を塞ぐファイアウォール (127.0.0.1 は通る)
          $env:HTTP_PROXY = "http://127.0.0.1:9"; $env:HTTPS_PROXY = "http://127.0.0.1:9"; $env:NO_PROXY = "127.0.0.1,localhost"
          $env:PIP_INDEX_URL = "http://127.0.0.1:9/simple"
          foreach ($exe in "LocalCoder.exe", "LocalCoderCLI.exe") {
            New-NetFirewallRule -DisplayName "lc-offline-$exe" -Direction Outbound -Action Block -Program "$usb\$exe" | Out-Null
          }
          $a = @("--home", $h, "--config", $cfg, "--kinds", "cpu", "--ctx", "8192", "--workspace", $ws, "--yes",
                 "--task", "hello.txt というファイルを作って、中身を「こんにちは」の 1 行にしてください。")
          & "$usb\LocalCoderCLI.exe" @a 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\offline.txt"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\offline.txt"
          if ($code -ne 0) { throw "offline run failed ($code)" }
          $log = Get-Content "$env:RUNNER_TEMP\offline.txt" -Raw
          if ($log -notmatch "USB オールインワンから導入します") { throw "did not use the USB bundle" }
          if ($log -match "を取得します|llama\.cpp b\d+ を用意します|導入器を取得") { throw "something was downloaded" }
          if (-not (Test-Path "$ws\hello.txt")) { throw "hello.txt was not created" }
          Get-Content "$ws\hello.txt"
          # .exe にする道具も、USB の wheel だけで入っている
          $py = (Get-ChildItem -Recurse "$h\python" -Filter python.exe | Select-Object -First 1).FullName
          if (-not $py) { throw "python was not prepared offline" }
          & $py -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller was not installed offline" }
          Set-Content -Path "$env:RUNNER_TEMP\hi2.py" -Value "print('hi offline')"
          & $py -m PyInstaller --onefile --noconfirm --distpath "$env:RUNNER_TEMP\dist2" --workpath "$env:RUNNER_TEMP\build2" `
            --specpath "$env:RUNNER_TEMP" "$env:RUNNER_TEMP\hi2.py" 2>&1 | Select-Object -Last 3
          $out = & "$env:RUNNER_TEMP\dist2\hi2.exe"
          if ($out -ne "hi offline") { throw "offline-built exe printed: $out" }

      - name: "USB all-in-one: emergency stop (非常停止) and uninstall"
        timeout-minutes: 20
        run: |
          $usb = "$env:RUNNER_TEMP\USB\LocalCoder"
          $h = "$env:RUNNER_TEMP\offline-home"
          $cfg = "$env:RUNNER_TEMP\offline.json"
          $p = Start-Process -FilePath "$usb\LocalCoder.exe" -ArgumentList @("--config", $cfg, "--home", $h, "--kinds", "cpu", "--ctx", "8192") -PassThru
          $t0 = Get-Date
          do {
            Start-Sleep -Seconds 3
            $srv = Get-Process llama-server -ErrorAction SilentlyContinue
            $rec = Test-Path "$h\logs\processes.json"
          } until (($srv -and $rec) -or ((Get-Date) - $t0).TotalSeconds -gt 300)
          if (-not $srv) { throw "the window did not start the model" }
          Get-Content "$h\logs\processes.json"
          & "$usb\LocalCoderCLI.exe" --force-stop --config $cfg 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\fs.txt"
          Get-Content "$env:RUNNER_TEMP\fs.txt"
          Start-Sleep -Seconds 3
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "llama-server is still running" }
          $left = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq "$usb\LocalCoder.exe" }
          if ($left) { throw "LocalCoder.exe is still running" }
          & "$usb\LocalCoderUninstall.exe" --config $cfg --yes --all 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\un-usb.txt"
          Get-Content "$env:RUNNER_TEMP\un-usb.txt"
          if (Test-Path $h) { throw "the offline install was not removed" }
          foreach ($f in "LocalCoder.exe", "LocalCoderCLI.exe", "bundle\manifest.json") {
            if (-not (Test-Path "$usb\$f")) { throw "the uninstaller removed $f from the USB" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalCoder-windows
          path: |
            extras/localcoder/dist/LocalCoder.exe
            extras/localcoder/dist/LocalCoderCLI.exe
            extras/localcoder/dist/LocalCoderUninstall.exe
          retention-days: 30
