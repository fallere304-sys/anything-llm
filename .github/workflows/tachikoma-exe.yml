name: Build tachikoma.exe

# extras/tachikoma を Windows 上で PyInstaller により 1 ファイルの実行ファイルにする。
# 出来た tachikoma.exe は Actions の実行結果ページの "Artifacts" からダウンロードできる。
on:
  push:
    paths:
      - "extras/tachikoma/**"
      - ".github/workflows/tachikoma-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extras/tachikoma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name tachikoma `
            --icon packaging/tachikoma.ico `
            --add-data "ui/static:ui/static" --add-data "finetune:finetune" `
            --add-data "config.example.json:." --add-data "config.voice.example.json:." --add-data "README.md:." `
            --paths . packaging/entry.py

      - name: Smoke test (exe starts and serves the UI)
        run: |
          $d = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke"
          Copy-Item dist\tachikoma.exe $d
          $p = Start-Process -FilePath "$d\tachikoma.exe" -WorkingDirectory $d -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          # Ollama が無い環境なので、接続エラーで終了していれば起動自体は成功 (設定ファイルが作られる)
          if (-not (Test-Path "$d\config.json")) { throw "config.json was not created" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }

      - uses: actions/upload-artifact@v4
        with:
          name: tachikoma-windows
          path: extras/tachikoma/dist/tachikoma.exe
          retention-days: 30
