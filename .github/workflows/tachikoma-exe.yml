name: Build Tachikoma.exe

# extras/tachikoma を Windows 用の 1 つのアプリ (Tachikoma.exe) にする。
# Tachikoma.exe は組み込み版 Python と本体を内蔵し、初回に %LOCALAPPDATA%\Tachikoma へ自分を入れて起動する。
# 出来た Tachikoma.exe は Actions の実行結果ページの "Artifacts" からダウンロードできる。
on:
  push:
    paths:
      - "extras/tachikoma/**"
      - ".github/workflows/tachikoma-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: extras/tachikoma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build the payload (embedded Python + Tachikoma)
        run: python packaging/build_app.py --out build/payload.zip

      - name: Build Tachikoma.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name Tachikoma `
            --icon packaging/tachikoma.ico --add-data "build/payload.zip:." packaging/launcher.py

      - name: Self-test (install, then run the whole test suite on the bundled Python)
        run: |
          $home_dir = "$env:RUNNER_TEMP\tachikoma-home"
          dist\Tachikoma.exe --home $home_dir --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }

      - name: "Smoke test (start without Ollama, it must set up and stop with a clear message)"
        run: |
          $home_dir = "$env:RUNNER_TEMP\tachikoma-home"
          $out = dist\Tachikoma.exe --home $home_dir --no-shortcut 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 3) { throw "expected exit code 3 without Ollama, got $LASTEXITCODE" }
          if (-not (Test-Path "$home_dir\app\config.json")) { throw "config.json was not created" }
          if (-not (Test-Path "$home_dir\python\python.exe")) { throw "python was not installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Tachikoma-windows
          path: extras/tachikoma/dist/Tachikoma.exe
          retention-days: 30
