import javax.inject.Inject

plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 音声認識エンジン: sherpa-onnx (k2-fsa, Apache-2.0)
// 日本語モデル: ReazonSpeech zipformer (reazonspeech-k2-v2, Apache-2.0) の int8 版
// 発話区切り: Silero VAD
//
// いずれも GitHub の配布物をビルド時に自動ダウンロードし、APK に同梱する。
// ネットワークに繋がらない環境では、同名のファイルを手動で
//   <プロジェクト>/.model-cache/
// に置けばそれが使われる。
// ---------------------------------------------------------------------------
def sherpaVersion = '1.13.8'
def sherpaRelease = 'https://github.com/k2-fsa/sherpa-onnx/releases/download'
def asrModelName = 'sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01'
def modelCacheDir = rootProject.file('.model-cache')

void downloadIfMissing(String url, File dest) {
    if (dest.exists()) {
        return
    }
    dest.parentFile.mkdirs()
    File tmp = new File(dest.path + '.part')
    println "Downloading ${url}"
    new URL(url).withInputStream { input ->
        tmp.withOutputStream { out -> out << input }
    }
    if (!tmp.renameTo(dest)) {
        throw new GradleException("cannot rename ${tmp} to ${dest}")
    }
}

// sherpa-onnx の Android ライブラリ (AAR) は Maven Central に無いため、配布物を直接使う
def sherpaAar = new File(modelCacheDir, "sherpa-onnx-${sherpaVersion}.aar")
downloadIfMissing("${sherpaRelease}/v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar", sherpaAar)

abstract class PrepareAsrModel extends DefaultTask {
    @Input abstract Property<String> getModelName()
    @Input abstract Property<String> getModelUrl()
    @Input abstract Property<String> getVadUrl()
    @Internal abstract DirectoryProperty getCacheDir()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @Inject abstract ArchiveOperations getArchiveOps()
    @Inject abstract FileSystemOperations getFsOps()

    @TaskAction
    void prepare() {
        File cache = cacheDir.get().asFile
        String name = modelName.get()
        File archive = new File(cache, "${name}.tar.bz2")
        File vad = new File(cache, 'silero_vad.onnx')
        download(modelUrl.get(), archive)
        download(vadUrl.get(), vad)

        File out = outputDir.get().asFile
        fsOps.delete { delete out }
        fsOps.copy {
            from archiveOps.tarTree(archive)  // 拡張子 .tar.bz2 から bzip2 と自動判定される
            // 端末で使う int8 版だけを取り出す (sherpa-onnx の Android サンプルと同じ組み合わせ)
            include "${name}/encoder-epoch-99-avg-1.int8.onnx"
            include "${name}/decoder-epoch-99-avg-1.onnx"
            include "${name}/joiner-epoch-99-avg-1.int8.onnx"
            include "${name}/tokens.txt"
            into new File(out, 'asr')
            eachFile { details ->
                details.relativePath = new RelativePath(true, details.relativePath.lastName)
            }
            includeEmptyDirs = false
        }
        fsOps.copy {
            from vad
            into new File(out, 'asr')
        }
    }

    private static void download(String url, File dest) {
        if (dest.exists()) {
            return
        }
        dest.parentFile.mkdirs()
        File tmp = new File(dest.path + '.part')
        println "Downloading ${url}"
        new URL(url).withInputStream { input ->
            tmp.withOutputStream { o -> o << input }
        }
        tmp.renameTo(dest)
    }
}

def prepareAsrModel = tasks.register('prepareAsrModel', PrepareAsrModel) {
    modelName.set(asrModelName)
    modelUrl.set("${sherpaRelease}/asr-models/${asrModelName}.tar.bz2")
    vadUrl.set("${sherpaRelease}/asr-models/silero_vad.onnx")
    cacheDir.set(rootProject.layout.projectDirectory.dir('.model-cache'))
    outputDir.set(layout.buildDirectory.dir('generated/asrModel'))
}

android {
    namespace 'app.mojiokoshi'
    compileSdk 35

    defaultConfig {
        applicationId 'app.mojiokoshi'
        minSdk 23          // Android 6.0
        targetSdk 35
        versionCode 2
        versionName '2.0'

        ndk {
            // Xperia Z4 (Snapdragon 810) は ARM。x86 系ライブラリは除外して APK を軽くする
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // JNI から Kotlin のクラスを参照するため難読化はしない
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // モデル (約 170MB) を圧縮せずに格納し、起動時の読み込みを速くする
        noCompress 'onnx'
    }

    lint {
        // リリースビルド時の lint でビルドを止めない
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            // Android 6.0 で確実にネイティブライブラリを展開させる
            useLegacyPackaging true
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(prepareAsrModel) { it.outputDir }
    }
}

dependencies {
    implementation files(sherpaAar)
    // sherpa-onnx の Android API は Kotlin 製 (1.7 でビルド) なので標準ライブラリが要る
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
