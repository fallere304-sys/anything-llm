<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI相棒</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1218; --panel:#171b24; --line:#262c38; --text:#e6e9ef; --dim:#8b93a3;
          --user:#27406b; --ai:#1d2230; --ok:#3ecf8e; --think:#f5b942; --work:#4da3ff; --err:#ff5d6c; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
              font:15px/1.55 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:900px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel);
           border-bottom:1px solid var(--line); padding-top:max(10px, env(safe-area-inset-top)); }
  header h1 { font-size:16px; margin:0; flex:1; }
  #dot { width:12px; height:12px; border-radius:50%; background:var(--ok); flex:none; }
  #dot.thinking { background:var(--think); animation:pulse 1s infinite; }
  #dot.responding { background:var(--work); animation:pulse .6s infinite; }
  #dot.error { background:var(--err); }
  @keyframes pulse { 50% { opacity:.3; } }
  #state { font-size:13px; color:var(--dim); }
  button { background:#2a3142; color:var(--text); border:1px solid var(--line); border-radius:8px;
           padding:8px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:#3a63b8; border-color:#3a63b8; }
  #meta { display:flex; flex-wrap:wrap; gap:6px 12px; padding:6px 14px; font-size:12px; color:var(--dim);
          border-bottom:1px solid var(--line); }
  #meta .ext { color:var(--think); }
  #banner { display:none; padding:8px 14px; background:#3a1a20; color:#ffb3bb; font-size:13px;
            border-bottom:1px solid var(--err); white-space:pre-wrap; }
  #main { flex:1; display:flex; min-height:0; position:relative; }
  #list { width:230px; border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); flex:none; }
  #list .item { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:6px; }
  #list .item.active { background:#222a3a; }
  #list .item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .del { color:var(--dim); background:none; border:none; padding:0 4px; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:14px; }
  .msg { max-width:88%; margin:0 0 10px; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:var(--user); margin-left:auto; border-bottom-right-radius:4px; }
  .msg.assistant { background:var(--ai); border-bottom-left-radius:4px; }
  .empty { color:var(--dim); text-align:center; margin-top:30px; }
  form { display:flex; gap:8px; padding:10px 14px; padding-bottom:max(10px, env(safe-area-inset-bottom));
         background:var(--panel); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--text); border:1px solid var(--line);
             border-radius:10px; padding:9px 12px; font:inherit; max-height:140px; }
  #menu { display:none; }
  @media (max-width:640px) {
    #menu { display:inline-block; }
    #list { position:absolute; z-index:5; top:0; bottom:0; left:0; transform:translateX(-100%); transition:transform .2s; }
    #list.open { transform:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menu" type="button" aria-label="会話一覧">☰</button>
    <div id="dot"></div>
    <h1>AI相棒</h1>
    <span id="state">待機中</span>
    <button id="new" type="button">＋ 新規</button>
  </header>
  <div id="meta"></div>
  <div id="banner" role="alert"></div>
  <div id="main">
    <nav id="list"></nav>
    <div id="chatcol">
      <div id="log"></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="メッセージを入力" maxlength="8000"></textarea>
        <button class="primary" id="send" type="submit">送信</button>
      </form>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STATE_LABEL = { idle:"待機中", thinking:"考え中…", responding:"応答中…", error:"エラー" };
let token = (() => { try { return localStorage.getItem("buddyToken") || ""; } catch { return ""; } })();
let convs = [], current = null, busy = false;

async function api(path, opts = {}) {
  const headers = { "X-Buddy-Token": token, ...(opts.body ? { "Content-Type":"application/json" } : {}) };
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    const t = prompt("アクセストークンを入力してください");
    if (t === null) throw new Error("認証が必要です");
    token = t.trim();
    try { localStorage.setItem("buddyToken", token); } catch {}
    return api(path, opts);
  }
  return res;
}
async function json(path, opts) {
  const res = await api(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

function setState(s) {
  $("dot").className = s === "idle" ? "" : s;
  $("state").textContent = STATE_LABEL[s] || s;
}
function showError(msg) { const b = $("banner"); b.textContent = msg; b.style.display = msg ? "block" : "none"; }

async function refreshStatus() {
  try {
    const s = await json("/api/status");
    if (!busy) setState(s.state);
    const reach = s.llm_reachable ? "LLM接続OK" : `LLM未接続(${s.llm_detail})`;
    $("meta").innerHTML = "";
    const add = (t, cls) => { const e = document.createElement("span"); e.textContent = t; if (cls) e.className = cls; $("meta").appendChild(e); };
    add(`プロバイダ: ${s.provider}`); add(`モデル: ${s.model}`); add(reach);
    if (s.external) add("⚠ 会話内容は外部サービスへ送信されます", "ext");
  } catch (e) { showError("状態を取得できません: " + e.message); }
}

function bubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;  // textContent: XSS対策
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function renderList() {
  const el = $("list"); el.innerHTML = "";
  convs.forEach((c) => {
    const row = document.createElement("div");
    row.className = "item" + (current === c.id ? " active" : "");
    const t = document.createElement("span"); t.textContent = c.title;
    const del = document.createElement("button"); del.className = "del"; del.textContent = "✕"; del.title = "削除";
    del.onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm(`「${c.title}」を削除しますか?(元に戻せません)`)) return;
      await json(`/api/conversations/${c.id}`, { method:"DELETE" });
      if (current === c.id) current = null;
      await loadConvs();
    };
    row.onclick = () => { openConv(c.id); $("list").classList.remove("open"); };
    row.append(t, del); el.appendChild(row);
  });
}
async function loadConvs() {
  convs = await json("/api/conversations");
  if (!current && convs.length) current = convs[0].id;
  renderList(); await openConv(current);
}
async function openConv(id) {
  current = id; renderList(); $("log").innerHTML = "";
  if (!id) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "メッセージを送って会話を始めましょう。"; $("log").appendChild(e); return; }
  (await json(`/api/conversations/${id}/messages`)).forEach((m) => bubble(m.role, m.content));
}
async function newConv() {
  const c = await json("/api/conversations", { method:"POST", body: JSON.stringify({}) });
  current = c.id; convs.unshift(c); renderList(); await openConv(c.id); $("input").focus();
}

async function send(text) {
  if (!current) await newConv();
  busy = true; $("send").disabled = true; showError("");
  bubble("user", text);
  const ai = bubble("assistant", "");
  try {
    const res = await api(`/api/conversations/${current}/messages`, { method:"POST", body: JSON.stringify({ content: text }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "status") setState(ev.state);
        else if (ev.type === "delta") { ai.textContent += ev.text; $("log").scrollTop = $("log").scrollHeight; }
        else if (ev.type === "error") { setState("error"); showError(ev.message); if (!ai.textContent) ai.remove(); }
      }
    }
  } catch (e) { setState("error"); showError("送信に失敗しました: " + e.message); if (!ai.textContent) ai.remove(); }
  busy = false; $("send").disabled = false;
  convs = await json("/api/conversations"); renderList(); refreshStatus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault(); const t = $("input").value.trim();
  if (!t || busy) return; $("input").value = ""; $("input").style.height = "auto"; send(t);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("new").onclick = newConv;
$("menu").onclick = () => $("list").classList.toggle("open");
loadConvs().then(refreshStatus).catch((e) => showError("起動に失敗しました: " + e.message));
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
